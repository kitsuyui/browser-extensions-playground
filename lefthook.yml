# Clear Git hook environment variables before running checks so nested or sibling
# repositories are not affected. The cleanup logic lives in
# scripts/run-without-git-env.sh: https://git-scm.com/docs/githooks
pre-commit:
  jobs:
    - name: lint
      run: scripts/run-without-git-env.sh bun run lint
    - name: typecheck
      run: scripts/run-without-git-env.sh bun run typecheck

pre-push:
  jobs:
    - name: lint
      run: scripts/run-without-git-env.sh bun run lint
    - name: typecheck
      run: scripts/run-without-git-env.sh bun run typecheck
    - name: test
      run: scripts/run-without-git-env.sh bun run test
