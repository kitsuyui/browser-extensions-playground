name: Update gitignore file
on:
  schedule:
    # daily at 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitignore-in/install-gibo@v0.1.0

      - name: Install gitignore.in
        run: bash scripts/install-gitignore-in.sh

      - name: Run gitignore.in
        run: gitignore.in

      - name: Update gitignore branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-gitignore-branch.sh
