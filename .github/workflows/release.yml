name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # https://nodejs.org/en/about/previous-releases
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: install dependencies
        run: |
          bun install --frozen-lockfile

      - name: verify checked-in package versions
        run: |
          set -eu
          EXPECTED_VERSION=""
          ACTUAL_VERSION=""

          if [ "${{ github.event_name }}" = "release" ]; then
            EXPECTED_VERSION="${{ github.event.release.tag_name }}"
            EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          fi

          for dir in packages/*; do
            if [ -f "$dir/package.json" ]; then
              VERSION="$(jq -r '.version' "$dir/package.json")"
              if [ "$VERSION" = "0.0.0" ]; then
                echo "::error file=$dir/package.json::checked-in package versions must be bumped before release validation or publish dry-runs"
                exit 1
              fi

              if [ -z "$ACTUAL_VERSION" ]; then
                ACTUAL_VERSION="$VERSION"
              elif [ "$VERSION" != "$ACTUAL_VERSION" ]; then
                echo "::error file=$dir/package.json::package version $VERSION does not match workspace release version $ACTUAL_VERSION"
                exit 1
              fi

              if [ -n "$EXPECTED_VERSION" ] && [ "$VERSION" != "$EXPECTED_VERSION" ]; then
                echo "::error file=$dir/package.json::package version $VERSION does not match release tag $EXPECTED_VERSION"
                exit 1
              fi
            fi
          done

      - name: build and validate
        run: |
          bun run build
          bun run validate

      - name: deploy
        # https://docs.npmjs.com/generating-provenance-statements
        run: |
          set -eu
          for dir in packages/*; do
            if [ "$(jq -r '.private // true' "$dir/package.json")" = "true" ]; then
              continue
            fi
            (
              cd "$dir"
              NPM_CONFIG_PROVENANCE=true bun publish --access public
            )
          done
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: deploy (dry-run)
        run: |
          set -eu
          for dir in packages/*; do
            if [ "$(jq -r '.private // true' "$dir/package.json")" = "true" ]; then
              continue
            fi
            (
              cd "$dir"
              NPM_CONFIG_PROVENANCE=true bun publish --access public --dry-run
            )
          done
        if: github.event_name != 'release' || github.event.release.prerelease
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
